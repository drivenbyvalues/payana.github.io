<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title | default: 'Professional Resume' }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/resume.css' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-container">
            <a href="{{ '/' | relative_url }}" class="nav-logo">
                {{ site.title | default: 'Resume' }}
            </a>
            <div class="nav-links">
                <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>
                    <i class="fas fa-user"></i> About
                </a>
                <a href="{{ '/skills' | relative_url }}" {% if page.url == '/skills/' %}class="active"{% endif %}>
                    <i class="fas fa-code"></i> Skills
                </a>
                <a href="{{ '/timeline' | relative_url }}" {% if page.url == '/timeline/' %}class="active"{% endif %}>
                    <i class="fas fa-history"></i> Timeline
                </a>
                <a href="{{ '/articles' | relative_url }}" {% if page.url == '/articles/' or page.url contains '/articles/' %}class="active"{% endif %}>
                    <i class="fas fa-feather-alt"></i> Articles
                </a>
                <a href="{{ '/certifications' | relative_url }}" {% if page.url == '/certifications/' %}class="active"{% endif %}>
                    <i class="fas fa-certificate"></i> Certifications
                </a>
                <a href="{{ '/learning' | relative_url }}" {% if page.url == '/learning/' %}class="active"{% endif %}>
                    <i class="fas fa-graduation-cap"></i> Learning
                </a>
                <a href="{{ '/years' | relative_url }}" {% if page.url == '/years/' or page.url contains '/years/' %}class="active"{% endif %}>
                    <i class="fas fa-calendar-alt"></i> Years
                </a>
            </div>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <div class="container">
        {{ content }}
    </div>

    <script>
        // Mobile menu toggle
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.mobile-menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            
            if (menuToggle) {
                menuToggle.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                });
            }
            
            // Close mobile menu when a link is clicked
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                });
            });
        });
    </script>
</body>
</html>
