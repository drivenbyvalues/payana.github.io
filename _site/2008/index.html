<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2008 - Internship Experience</title>
    <link rel="stylesheet" href="/assets/css/resume.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="main-nav">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                Driven By Values
            </a>
            <div class="nav-links">
                <a href="/" >
                    <i class="fas fa-user"></i> About
                </a>
                <a href="/skills" >
                    <i class="fas fa-code"></i> Skills
                </a>
                <a href="/timeline" >
                    <i class="fas fa-history"></i> Timeline
                </a>
                <a href="/certifications" >
                    <i class="fas fa-certificate"></i> Certifications
                </a>
                <a href="/learning" >
                    <i class="fas fa-graduation-cap"></i> Learning
                </a>
                <a href="/years" >
                    <i class="fas fa-calendar-alt"></i> Years
                </a>
            </div>
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <div class="container">
        <main class="container">
    <article class="year-article">
        <header class="year-header">
            <h1>2008 - Internship Experience</h1>
            
            <p class="subtitle">First Industry Exposure</p>
            
        </header>

        <div class="year-content">
            <h2 id="summer-internship">Summer Internship</h2>
<ul>
  <li>Completed first professional internship</li>
  <li>Gained practical software development experience</li>
  <li>Worked on real-world projects</li>
</ul>


        </div>

        <div class="year-navigation" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #eee;">
            
            
            

            <div class="nav-links" style="display: flex; justify-content: space-between; max-width: 400px; margin: 0 auto;">
                
                <a href="/2007/" class="button" style="padding: 0.5rem 1rem; background: #f5f5f5; border-radius: 4px; text-decoration: none; color: #333; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-chevron-left"></i> 2007
                </a>
                

                <a href="/years/" class="button" style="padding: 0.5rem 1rem; background: #f5f5f5; border-radius: 4px; text-decoration: none; color: #333; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-calendar-alt"></i> All Years
                </a>

                
                <a href="/2009/" class="button" style="padding: 0.5rem 1rem; background: #f5f5f5; border-radius: 4px; text-decoration: none; color: #333; display: flex; align-items: center; gap: 0.5rem;">
                    2009 <i class="fas fa-chevron-right"></i>
                </a>
                
            </div>
        </div>
    </article>
</main>

<script>
    // Ensure the year navigation works on individual year pages too
    document.addEventListener('DOMContentLoaded', function() {
        // Mobile menu toggle
        const menuToggle = document.querySelector('.mobile-menu-toggle');
        const navLinks = document.querySelector('.nav-links');

        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', function() {
                navLinks.classList.toggle('active');
                menuToggle.setAttribute('aria-expanded',
                    menuToggle.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'
                );
            });
        }

        // Handle clicks on navigation buttons
        document.querySelectorAll('.year-navigation .button').forEach(button => {
            if (button.getAttribute('data-year')) {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = `/${this.getAttribute('data-year')}/`;
                });
            }
        });
    });
</script>

<style>
    .year-article {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem 1rem;
    }

    .year-header {
        margin-bottom: 2.5rem;
        text-align: center;
    }

    .year-header h1 {
        color: #2c3e50;
        margin: 0 0 0.5rem 0;
        font-size: 2.5rem;
        font-weight: 600;
    }

    .year-header .subtitle {
        color: #6a737d;
        font-size: 1.25rem;
        margin: 0.5rem 0 0;
        font-weight: 400;
    }

    .year-content {
        line-height: 1.7;
        font-size: 1.1rem;
        color: #24292e;
    }

    .year-content h2,
    .year-content h3,
    .year-content h4 {
        margin-top: 2rem;
        color: #2c3e50;
    }

    .year-navigation {
        margin-top: 4rem;
        padding-top: 2rem;
        border-top: 1px solid #e1e4e8;
    }

    .nav-links {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .nav-links .button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.2rem;
        background-color: #f6f8fa;
        border: 1px solid rgba(27, 31, 35, 0.15);
        border-radius: 6px;
        color: #24292e;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        transition: all 0.2s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .nav-links .button:hover {
        background-color: #f3f4f6;
        border-color: rgba(27, 31, 35, 0.2);
        transform: translateY(-1px);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .nav-links .button i {
        font-size: 0.85em;
    }

    /* Responsive styles */
    @media (max-width: 768px) {
        .year-article {
            padding: 1.5rem 1rem;
        }

        .year-header h1 {
            font-size: 2rem;
        }

        .year-header .subtitle {
            font-size: 1.1rem;
        }

        .nav-links {
            flex-direction: column;
            align-items: stretch;
            gap: 0.75rem;
        }

        .nav-links .button {
            justify-content: center;
            padding: 0.7rem 1rem;
        }

        .nav-links span:empty {
            display: none;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Highlight the current year in the sidebar
        const currentPath = window.location.pathname;
        const yearLinks = document.querySelectorAll('.years-nav a');

        yearLinks.forEach(link => {
            const linkPath = new URL(link.href).pathname;
            if (currentPath === linkPath) {
                link.classList.add('active');
            }
        });
    });
</script>

<style>
    .year-range-page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    .year-range-page h1 {
        color: #2c3e50;
        margin-bottom: 20px;
    }

    .year-range-page h2 {
        color: #2c3e50;
        border-bottom: 2px solid #ecf0f1;
        padding-bottom: 10px;
        margin-top: 30px;
    }

    .year-range-page h3 {
        color: #3498db;
        margin: 20px 0 10px 0;
    }

    .year-range-page p, .year-range-page li {
        color: #34495e;
        line-height: 1.6;
    }

    .year-navigation .nav-links {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .year-navigation .button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        background-color: #0366d6;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        transition: background-color 0.2s;
    }

    .year-navigation .button:hover {
        background-color: #0356b6;
    }

    .year-navigation .button i {
        font-size: 0.9em;
    }

    @media (max-width: 768px) {
        .year-navigation .nav-links {
            flex-direction: column;
            gap: 1rem;
        }

        .year-navigation .button {
            width: 100%;
            justify-content: center;
        }
    }
    }

    .year-range-page ul {
        padding-left: 20px;
    }

    .year-range-page li {
        margin-bottom: 8px;
    }

    .highlight-box {
        background: #f8f9fa;
        border-left: 4px solid #3498db;
        padding: 20px;
        margin: 20px 0;
        border-radius: 4px;
    }

    @media (max-width: 768px) {
        .year-range-page {
            padding: 10px;
        }

        .year-range-page h1 {
            font-size: 1.8em;
        }
    }
</style>

    </div>

    <script>
        // Mobile menu toggle
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.mobile-menu-toggle');
            const navLinks = document.querySelector('.nav-links');
            
            if (menuToggle) {
                menuToggle.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                });
            }
            
            // Close mobile menu when a link is clicked
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('active');
                });
            });
        });
    </script>
</body>
</html>
