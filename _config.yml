title: Driven By Values
description: Personal Webpage for Career journey
show_downloads: false
google_analytics:
theme: jekyll-theme-architect

# Plugins
plugins:
  - jekyll-seo-tag

# Enable plugins
gems:
  - jekyll-seo-tag

# Plugin settings
year_pages:
  enabled: true
  years:
    start: 1998
    end: 2025

# Include all files in the _pages directory
include:
  - _pages

# Set default front matter defaults
defaults:
  - scope:
      path: "_pages"
    values:
      layout: "default"
      permalink: /:title/

# Exclude files from being processed
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor